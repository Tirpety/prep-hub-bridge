# Publishes the module as a GitHub release so Foundry can install it from a manifest URL.
#
# Usage: Actions -> Release -> Run workflow and enter a version like 0.4.0, or push a tag like
# `v0.4.0`. Manifest URL (always the latest release):
#   https://github.com/<owner>/<repo>/releases/latest/download/module.json
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.4.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT_VERSION#v}"; fi
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 0.4.0 (got '$v')"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stamp version and URLs into module.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          jq --arg v "$VERSION" --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/prep-hub-bridge.zip"
          ' module.json > module.json.tmp
          mv module.json.tmp module.json

      - name: Package
        run: zip -r prep-hub-bridge.zip module.json scripts styles lang

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Prep Hub Bridge v${{ steps.version.outputs.version }}
          files: |
            module.json
            prep-hub-bridge.zip
